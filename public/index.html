<!DOCTYPE html>

    <meta name="theme-color" content="rgb(15 23 42)" />

    <!-- Fonts are self-hosted (see src/index.css). Preloaded because they
         are otherwise only discovered after main.css has been parsed. -->
    <link rel="preload" as="font" type="font/woff2"
          href="%PUBLIC_URL%/fonts/nunito-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
          href="%PUBLIC_URL%/fonts/jetbrains-mono-latin.woff2" crossorigin />

    <!-- @font-face lives here rather than in index.css so the browser can
         start the font requests from the first bytes of HTML, instead of
         waiting for the stylesheet to download and parse. -->
    <style>
      @font-face {
        font-family: "Nunito";
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/nunito-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Nunito";
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/nunito-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {

        font-weight: 100 800;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/jetbrains-mono-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {

        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/jetbrains-mono-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
